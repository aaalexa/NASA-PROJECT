[project]
name = "nasa-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask==2026.8.0",
    "earthaccess==0.19.0",
    "fastapi[standard]>=0.163.0",
    "geopandas==1.2.0",
    "h5netcdf==1.8.3",
    "netcdf4==1.7.5.1.post1",
    "numpy==2.5.4",
    "plotly==7.1.0",
    "pymannkendall==1.4.3",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "regionmask==0.13.0",
    "rioxarray==0.24.0",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "streamlit==1.67.0",
    "xarray==2026.9.0",
    "zarr==3.4.2",
]

[project.scripts]
nasa-project = "core.main:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core"
